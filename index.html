<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Application</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="container-fluid min-vh-100 d-flex justify-content-center align-items-center shadow-lg"
    >
      <div class="card quiz-card" id="quizCard">
        <div class="card-body">
          <h4 class="text-center quiz-app">Quiz App</h4>

          <div class="card-text justify-content-between mt-4">
            <div class="qnsNum" id="qnsNum">qns 1/10</div>

            <div class="timeLeft" id="timeDisplay">TimeLeft 30</div>
          </div>
          <div class="questions text-center mt-2" id="questions">questions</div>
          <div class="options row mt-3 g-3" id="options"></div>

          <button
            class="btn next-btn w-100 mt-4"
            onclick="nextQue()"
            id="nextBtn"
          >
            Next Que
          </button>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
